name: Android APK

on:
  workflow_dispatch:          # Actions tab > Android APK > Run workflow
  push:
    branches: [main]
    paths: ["flutter_app/**", ".github/workflows/android.yml"]

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create project files
        run: |
          flutter create --platforms=android,ios --org com.dana --project-name wallet .
          python3 scripts/patch_android.py
          flutter pub get
          dart run flutter_launcher_icons

      - name: Use the fixed signing key (keeps the Google SHA-1 the same on every build)
        env:
          KS: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 --decode > ~/.android/debug.keystore
          fi

      - name: Build APK
        run: |
          flutter build apk --release \
            --build-number ${{ github.run_number }} \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }} \
            --dart-define=GOOGLE_IOS_CLIENT_ID=${{ secrets.GOOGLE_IOS_CLIENT_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: wallet-android-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
