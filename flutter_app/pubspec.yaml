name: wallet
description: جزدانەکەم - standalone iPhone app (Flutter + Supabase).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  shared_preferences: ^2.3.0
  google_sign_in: ^6.2.2
  share_plus: ^10.1.4
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  ios: true
  android: true
  min_sdk_android: 21
  image_path: "assets/icon.png"
  remove_alpha_ios: true
