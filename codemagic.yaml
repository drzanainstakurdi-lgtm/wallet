workflows:
  wallet-flutter-ios:
    name: Wallet Flutter iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: flutter_app
    integrations:
      app_store_connect: CHANGE_ME_KEY_NAME      # 1) name of your App Store Connect API key in Codemagic
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.dana.wallet       # 2) must exist in your Apple Developer account
      vars:
        APP_STORE_APPLE_ID: "0000000000"         # 3) numeric Apple ID of the app in App Store Connect
      # 4) In Codemagic > Environment variables add: SUPABASE_URL and SUPABASE_ANON_KEY (anon key only!)
    scripts:
      - name: Create iOS project
        script: |
          flutter create --platforms=ios,android --org com.dana --project-name wallet .
      - name: Patch Info.plist
        script: sh scripts/patch_ios.sh
      - name: Get packages and icons
        script: |
          flutter pub get
          dart run flutter_launcher_icons
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build ipa
        script: |
          LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          case "$LATEST" in ''|*[!0-9]*) LATEST=0;; esac
          BUILD=$((LATEST + 1))
          flutter build ipa --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" \
            --dart-define=GOOGLE_IOS_CLIENT_ID="$GOOGLE_IOS_CLIENT_ID" \
            --build-name=1.0.$BUILD --build-number=$BUILD \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - flutter_app/build/ios/ipa/*.ipa
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  wallet-flutter-android:
    name: Wallet Flutter Android (APK)
    instance_type: linux_x2
    max_build_duration: 60
    working_directory: flutter_app
    environment:
      flutter: stable
      java: 17
      # Codemagic > Environment variables: SUPABASE_URL and SUPABASE_ANON_KEY (anon key only!)
    scripts:
      - name: Create Android project
        script: |
          flutter create --platforms=ios,android --org com.dana --project-name wallet .
      - name: Patch AndroidManifest
        script: python3 scripts/patch_android.py
      - name: Get packages and icons
        script: |
          flutter pub get
          dart run flutter_launcher_icons
      - name: Build APK
        script: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" \
            --dart-define=GOOGLE_IOS_CLIENT_ID="$GOOGLE_IOS_CLIENT_ID"
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - flutter_app/build/app/outputs/flutter-apk/*.apk
